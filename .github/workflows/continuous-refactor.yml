name: Continuous AI Refactoring

on:
  # Run daily at 10 AM UTC
  schedule:
    - cron: '0 10 * * *'

  # Allow manual triggering with project selection
  workflow_dispatch:
    inputs:
      project:
        description: 'Refactor project name'
        required: true
        default: 'doc-improvements'
        type: choice
        options:
          - doc-improvements

  # Automatic: Trigger on PR merge for continuous refactoring
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    # Only run on merged PRs with matching label, or non-PR triggers
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, '20'))

    steps:
      - uses: actions/checkout@v4

      - name: Determine project
        id: project
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Use manual input
            PROJECT="${{ github.event.inputs.project }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            # Find project by matching PR label to project config
            PR_NUMBER="${{ github.event.pull_request.number }}"

            # Get PR labels
            PR_LABELS=$(gh pr view $PR_NUMBER --json labels --jq '.labels[].name')

            # Search refactor projects for matching label
            PROJECT=""
            for config_file in refactor/*/configuration.json; do
              if [ -f "$config_file" ]; then
                LABEL=$(python3 -c "import json; print(json.load(open('$config_file'))['label'])")
                if echo "$PR_LABELS" | grep -q "^${LABEL}$"; then
                  # Extract project name from path: refactor/{project}/configuration.json
                  PROJECT=$(echo "$config_file" | sed -E 's|refactor/([^/]+)/configuration\.json|\1|')
                  echo "Found matching project: $PROJECT (label: $LABEL)"
                  break
                fi
              fi
            done

            if [ -z "$PROJECT" ]; then
              echo "::error::No refactor project found with matching label"
              exit 1
            fi
          else
            # Default for scheduled runs
            PROJECT="doc-improvements"
          fi
          echo "name=$PROJECT" >> $GITHUB_OUTPUT
          echo "Determined project: $PROJECT"

      - name: Run Continuous AI Refactoring
        id: refactor
        uses: gestrich/claude-refactor-chain@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          project_name: ${{ steps.project.outputs.name }}
          base_branch: dev

      - name: Output summary
        if: steps.refactor.outputs.pr_number
        run: |
          echo "✅ **Refactoring PR Created**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: ${{ steps.refactor.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reviewer**: @${{ steps.refactor.outputs.reviewer }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Task**: ${{ steps.refactor.outputs.task_completed }}" >> $GITHUB_STEP_SUMMARY
