name: ClaudeStep

on:
  # Run daily at 10 AM UTC
  schedule:
    - cron: '0 10 * * *'

  # Allow manual triggering with project selection
  workflow_dispatch:
    inputs:
      project:
        description: 'Refactor project name'
        required: true
        default: 'doc-improvements'
        type: choice
        options:
          - doc-improvements
          - import-sorting

  # Automatic: Trigger on PR merge for continuous refactoring
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    # Only run on merged PRs with matching label, or non-PR triggers
    if: |
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true && startsWith(github.head_ref, '20'))

    steps:
      - uses: actions/checkout@v4

      - name: Run ClaudeStep
        id: refactor
        uses: gestrich/claude-step@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # For manual/scheduled runs, specify project name
          project_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project || (github.event_name == 'schedule' && 'doc-improvements' || '') }}
          # For PR merge triggers, pass PR number to auto-detect project from labels
          merged_pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
          base_branch: dev

      - name: Output summary
        if: steps.refactor.outputs.pr_number
        run: |
          echo "✅ **Refactoring PR Created**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR**: ${{ steps.refactor.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Reviewer**: @${{ steps.refactor.outputs.reviewer }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Task**: ${{ steps.refactor.outputs.task_completed }}" >> $GITHUB_STEP_SUMMARY
