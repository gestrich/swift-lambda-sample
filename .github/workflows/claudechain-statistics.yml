# ClaudeChain Statistics Workflow
#
# Generates daily statistics reports for ClaudeChain projects.
# Posts results to Slack and GitHub Actions summary.
#
# Triggers:
# - Daily at 9 AM UTC
# - Manual trigger via workflow_dispatch

name: ClaudeChain Statistics

on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9 AM UTC
  workflow_dispatch:      # Allow manual triggers

permissions:
  contents: read
  actions: read

jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gestrich/claude-chain/statistics@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          base_branch: dev
          days_back: 7
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
